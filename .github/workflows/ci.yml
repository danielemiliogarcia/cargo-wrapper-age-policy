# Runs formatting, lint, and tests on the pinned toolchain and against legacy Cargo versions.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.100.0 --profile minimal -c rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  legacy-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.95.0", "1.99.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Test with ${{ matrix.toolchain }} as the target Cargo
        # The plugin is built and run by 1.100.0; the old Cargo is only the Cargo
        # that the fallback tests package, resolve, and check with.
        run: |
          export AGE_POLICY_TEST_CARGO="$(rustup which --toolchain "${{ matrix.toolchain }}" cargo)"
          "$AGE_POLICY_TEST_CARGO" --version
          cargo +1.100.0 test --all-targets --locked
