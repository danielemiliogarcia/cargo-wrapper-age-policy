# Defines the standalone age-policy plugin package, binary, dependencies, and release profile.
[package]
name = "cargo-wrapper-age-policy"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Native Cargo minimum-publish-age enforcement plugin for Cargo Wrapper"
repository = "https://github.com/danielemiliogarcia/cargo-wrapper-age-policy"

[[bin]]
name = "cargo-wrapper-plugin-age-policy"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
sha2 = "0.10"

[profile.dist]
inherits = "release"
lto = "thin"
